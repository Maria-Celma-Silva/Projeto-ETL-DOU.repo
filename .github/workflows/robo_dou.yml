name: Robô Diário Oficial (ETL)

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  executar_etl:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Atualizar pip e ferramentas de build
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Instalar as Bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o Pipeline ETL
        run: python main.py

      - name: Salvar as atualizações no GitHub
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'Robô DOU'
          author_email: 'action@github.com'
          message: 'Atualização automática: Novos registros do DOU'
          add: '*.db *.xlsx'
          push: true
